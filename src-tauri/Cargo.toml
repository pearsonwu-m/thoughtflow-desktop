[package]
name = "thoughtflow"
version = "0.1.0"
description = "A minimalist desktop thinking companion powered by Claude"
authors = ["Thoughtflow contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "thoughtflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util"] }
tokio-util = "0.7"
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util", "process", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by Tauri; used to float the widget over full-screen apps and to
# present it reliably.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
